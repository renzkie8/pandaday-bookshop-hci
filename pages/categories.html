<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories - Pandaday Bookshop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>

<body class="bg-white">

    <header class="site-header sticky-top">
        <div class="container py-3">
            <div class="row align-items-center">
                <div class="col-md-3 col-6">
                    <a class="navbar-brand" href="../index.html" aria-label="Pandayan Bookshop Home">
                        <i class="bi bi-book-half me-2"></i>Pandaday Bookshop
                    </a>
                </div>
                <div class="col-md-6 d-none d-md-block">
                    <form class="search-bar" role="search" action="search.html">
                        <input class="form-control form-control-lg" type="search"
                            placeholder="Search for products, categories, or brands..." aria-label="Search products">
                        <button class="btn bg-pandayan text-white" type="submit" aria-label="Submit search"><i
                                class="bi bi-search"></i></button>
                    </form>
                </div>
                <div class="col-md-3 col-6 text-end d-flex justify-content-end gap-2">
                    <a href="cart.html" class="header-icon" aria-label="Shopping Cart">
                        <i class="bi bi-cart3 fs-5"></i>
                        <span class="badge rounded-pill bg-warning text-dark">0</span>
                    </a>
                    <a href="dashboard.html" class="header-icon" aria-label="User Account">
                        <i class="bi bi-person-circle fs-5"></i>
                    </a>
                </div>
            </div>
        </div>
        <nav class="secondary-nav" aria-label="Main navigation">
            <div class="container">
                <ul class="navbar-nav flex-row gap-1">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="categories.html">Categories</a></li>
                    <li class="nav-item"><a class="nav-link" href="locator.html">Store Locator</a></li>
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="bulk-orders.html">Bulk Orders</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="container my-3">
        <div class="mb-4 px-2">
            <input class="form-control form-control-lg bg-light border-0" type="search"
                placeholder="Search categories...">
        </div>

        <h2 class="h6 text-muted fw-bold px-3 mb-3 text-uppercase">Browse by Category</h2>

        <div class="list-group list-group-flush border-top" id="categories-list">
            <a href="#" onclick="filterByCategory('school', event); hideCategories();"
                class="list-group-item list-group-item-action py-4 d-flex align-items-center border-bottom">
                <i class="bi bi-backpack fs-3 text-pandayan me-4"></i>
                <span class="fs-5 fw-semibold">School Supplies</span>
                <i class="bi bi-chevron-right ms-auto text-muted"></i>
            </a>
            <a href="#" onclick="filterByCategory('writing', event); hideCategories();"
                class="list-group-item list-group-item-action py-4 d-flex align-items-center border-bottom">
                <i class="bi bi-pen fs-3 text-pandayan me-4"></i>
                <span class="fs-5 fw-semibold">Writing Instruments</span>
                <i class="bi bi-chevron-right ms-auto text-muted"></i>
            </a>
            <a href="#" onclick="filterByCategory('art', event); hideCategories();"
                class="list-group-item list-group-item-action py-4 d-flex align-items-center border-bottom">
                <i class="bi bi-palette fs-3 text-pandayan me-4"></i>
                <span class="fs-5 fw-semibold">Art Supplies</span>
                <i class="bi bi-chevron-right ms-auto text-muted"></i>
            </a>
            <a href="#" onclick="filterByCategory('office', event); hideCategories();"
                class="list-group-item list-group-item-action py-4 d-flex align-items-center border-bottom">
                <i class="bi bi-building fs-3 text-pandayan me-4"></i>
                <span class="fs-5 fw-semibold">Office Supplies</span>
                <i class="bi bi-chevron-right ms-auto text-muted"></i>
            </a>
            <a href="#" onclick="filterByCategory('books', event); hideCategories();"
                class="list-group-item list-group-item-action py-4 d-flex align-items-center border-bottom">
                <i class="bi bi-book fs-3 text-pandayan me-4"></i>
                <span class="fs-5 fw-semibold">Books & Reading</span>
                <i class="bi bi-chevron-right ms-auto text-muted"></i>
            </a>
            <a href="#" onclick="filterByCategory('kids', event); hideCategories();"
                class="list-group-item list-group-item-action py-4 d-flex align-items-center border-bottom">
                <i class="bi bi-stars fs-3 text-pandayan me-4"></i>
                <span class="fs-5 fw-semibold">Kids Toys</span>
                <i class="bi bi-chevron-right ms-auto text-muted"></i>
            </a>
        </div>

        <div class="row g-4 mt-3" id="products-grid" style="display: none;"></div>

        <button id="show-categories-btn" class="btn btn-outline-secondary w-100 mt-4" style="display: none;"
            onclick="showCategories()">
            <i class="bi bi-arrow-left me-2"></i>Back to Categories
        </button>
    </main>

    <!-- Mobile Bottom Nav -->
    <nav class="bottom-nav">
        <a href="../index.html" class="bottom-nav-item"><i class="bi bi-house"></i>Home</a>
        <a href="categories.html" class="bottom-nav-item active"><i class="bi bi-grid-fill"></i>Categories</a>
        <a href="search.html" class="bottom-nav-item"><i class="bi bi-search"></i>Search</a>
        <a href="dashboard.html" class="bottom-nav-item"><i class="bi bi-person"></i>Account</a>
    </nav>

    <!-- Persistent Help Button -->
    <button id="help-btn" data-bs-toggle="modal" data-bs-target="#helpModal" aria-label="Open Help and Support"><i
            class="bi bi-question-circle me-2"></i>Help</button>
    <div class="modal fade" id="helpModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-pandayan">
                    <h5 class="modal-title"><i class="bi bi-headset me-2"></i>Pandayan Support</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="list-group list-group-flush">
                        <a href="dashboard.html" class="list-group-item list-group-item-action py-3"><i
                                class="bi bi-box-seam me-2 text-pandayan"></i>Track my order</a>
                        <a href="locator.html" class="list-group-item list-group-item-action py-3"><i
                                class="bi bi-shop me-2 text-pandayan"></i>Find a Store</a>
                    </div>
                    <div class="mt-4 text-center"><a href="tel:0289900909" class="btn btn-pandayan-outline w-100"><i
                                class="bi bi-telephone me-2"></i>Call (02) 8990-0909</a></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/app.js"></script>
    <script>
        function hideCategories() {
            document.getElementById('categories-list').style.display = 'none';
            document.querySelector('h2.text-uppercase').style.display = 'none';
            document.getElementById('products-grid').style.display = 'flex';
            document.getElementById('show-categories-btn').style.display = 'block';
        }
        function showCategories() {
            document.getElementById('categories-list').style.display = 'block';
            document.querySelector('h2.text-uppercase').style.display = 'block';
            document.getElementById('products-grid').style.display = 'none';
            document.getElementById('show-categories-btn').style.display = 'none';
            // Also clear search bar
            const searchInput = document.querySelector('input[type="search"]');
            if (searchInput) searchInput.value = '';
        }

        // Make sure search also hides categories
        document.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.querySelector('input[type="search"]');
            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    if (e.target.value.trim().length > 0) {
                        hideCategories();
                    } else {
                        showCategories();
                    }
                });
            }
        });
    </script>
</body>

</html>
